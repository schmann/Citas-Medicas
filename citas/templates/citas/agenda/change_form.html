{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block content %}
<div class="module aligned">
    {% if agenda_url %}
    <div style="background: #f8f8f8; padding: 10px 15px; border-left: 4px solid #417690; margin-bottom: 20px;">
        <h3 style="margin: 0 0 10px 0;">Acción Rápida</h3>
        <a href="{{ agenda_url }}" class="button" style="padding: 10px 15px; background: #417690; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; display: inline-block;">
            📅 Ver Agenda Completa de {{ medico_nombre|default:"Médicos" }}
        </a>
    </div>
    {% endif %}
</div>
{{ block.super }}
{% endblock %}
