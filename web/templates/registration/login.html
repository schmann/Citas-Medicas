{% extends "web/base.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-user-circle fa-3x text-primary mb-2"></i>
                    <h3 class="card-title text-primary">Iniciar Sesión</h3>
                </div>
                
                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        El nombre de usuario o la contraseña son incorrectos. Por favor, intente de nuevo.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Nombre de Usuario</label>
                        <input type="text" 
                               name="{{ form.username.name }}" 
                               id="{{ form.username.id_for_label }}" 
                               class="form-control" 
                               placeholder="Ingrese su nombre de usuario"
                               required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Contraseña</label>
                        <input type="password" 
                               name="{{ form.password.name }}" 
                               id="{{ form.password.id_for_label }}" 
                               class="form-control" 
                               placeholder="Ingrese su contraseña"
                               required>
                    </div>
                    
                    {% if next %}
                        <input type="hidden" name="next" value="{{ next }}" />
                    {% endif %}

                    <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                    
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
